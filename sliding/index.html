<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Love U</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon" />
  <style>
	@font-face {
		font-family: 'AmpleSoft';
		src: url('../css/fonts/AmpleSoft.ttf') format('truetype');
		font-weight: thin;
		font-style: normal;
	}
	body {
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	  justify-content: center;
	  min-height: 100vh;
	  background: #fff0f3;
	  font-family: 'AmpleSoft';
	  margin: 0;
	}

	h1 {
	  margin-bottom: 10px;
	  color: #c33;
	}

	#timer {
	  font-size: 18px;
	  color: #444;
	  margin-bottom: 20px;
	}

	#puzzle {
	  display: grid;
	  grid-template-columns: repeat(3, 100px);
	  grid-template-rows: repeat(3, 100px);
	  gap: 6px;
	  border: 6px solid #f55;
	  background: #fdd;
	  padding: 6px;
	  border-radius: 12px;
	}

	.tile {
	  width: 100px;
	  height: 100px;
	  background-size: cover;
	  background-position: center;
	  border-radius: 10px;
	  cursor: pointer;
	  transition: transform 0.2s, box-shadow 0.2s;
	}

	.tile:hover {
	  transform: scale(1.05);
	  box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
	}

	.empty {
	  background: #fff0f3;
	  border: 2px dashed #f66;
	  cursor: default;
	}

	@media (max-width: 400px) {
	  #puzzle {
		grid-template-columns: repeat(3, 80px);
		grid-template-rows: repeat(3, 80px);
	  }

	  .tile {
		width: 80px;
		height: 80px;
	  }
	}
  </style>
</head>
<body>
  <h1>Sliding Puzzle</h1>
  <div id="timer">⏱️ Thời gian: 0 giây</div>
  <div id="puzzle"></div>
  <p>Cre: Phong's commissions by <a href="https://www.facebook.com/quynh.nguyenthuy.127201">Cá Mắc Cạn</a></p>
  <script src="../js/index.js"></script>
  <script src="script.js"></script>
</body>
</html>
