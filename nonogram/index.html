<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonogram</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <button class="tab-btn" onclick="showSection('home')">Trang chủ</button>
    <button class="tab-btn" onclick="showSection('album')">Album</button>
    <button class="tab-btn" onclick="showSection('create')">Tạo Nonogram</button>
  </nav>

  <section id="home">
    <h2>Chào mừng đến với Nonogram</h2>
    <p>Chọn mục bên trên để bắt đầu.</p>
  </section>

  <section id="album" style="display: none;">
    <h2>Album Nonogram</h2>
    <div id="albumDiv" class="album-grid"></div>
  </section>

  <section id="play" style="display: none;">
    <h2 id="playTitle"></h2>
    <div id="playArea"></div>
  </section>

  <section id="create" style="display: none;">
    <h2>Tạo bảng</h2>
    <input type="text" id="creatorName" placeholder="Tên của bạn">
    <textarea id="creatorMessage" placeholder="Lời nhắn"></textarea>
    <div id="controls">
      <button onclick="addRow()">+ Hàng</button>
      <button onclick="removeRow()">– Hàng</button>
      <button onclick="addCol()">+ Cột</button>
      <button onclick="removeCol()">– Cột</button>
    </div>
    <table id="nonogramGrid"></table>
    <div class="color-picker" id="palette"></div>
    <input type="color" id="customColor" value="#000000">
    <button onclick="addCustomColor()">Thêm màu</button>
    <button class="preview" onclick="previewBoard()">Tạo thử</button>
    <button class="submit" onclick="submitBoard()">Gửi duyệt</button>
    <div id="previewArea"></div>
  </section>

  <!-- Load index.js first for Firebase initialization -->
  <script src="../js/index.js"></script>

  <!-- Load script.js after index.js -->
  <script src="script.js"></script>
</body>
</html>
