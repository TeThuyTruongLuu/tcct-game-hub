<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nonogram</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <h1>Nonogram</h1>
  <nav>
    <button onclick="showSection('home')">Trang chủ</button>
    <button onclick="showSection('album')">Album</button>
    <button onclick="showSection('create')">Tạo Nonogram</button>
  </nav>

  <section id="home">
    <h2>Chào mừng đến với Nonogram</h2>
    <p>Chọn mục bên trên để bắt đầu.</p>
  </section>

  <section id="album" style="display:none">
    <h2>Album Nonogram</h2>
    <div id="albumDiv"></div>
  </section>
  
  <section id="play" style="display: none">
    <h2 id="playTitle">Đang chơi</h2>
    <div id="playArea"></div>
  </section>

  <section id="create" style="display:none">
    <h2>Tạo bảng</h2>
    <label>Tên của bạn: <input type="text" id="creatorName" placeholder="Tên người tạo" /></label><br />
    <label>Lời nhắn: <input type="text" id="creatorMessage" placeholder="VD: Đố bạn biết ai là tui" /></label>

    <div id="controls">
      <button onclick="addRow()">+ Hàng</button>
      <button onclick="addCol()">+ Cột</button>
    </div>
    <div id="palette" class="color-picker"></div>
    <div style="margin-top: 10px;">
      <input type="color" id="customColor" />
      <button onclick="addCustomColor()">Thêm màu</button>
    </div>
    <table id="nonogramGrid"></table>
	<button class="preview" onclick="previewBoard()">Tạo thử</button>
	<button class="submit" onclick="submitBoard()">Gửi duyệt</button>
    <div id="previewArea"></div>
  </section>
</body>
</html>
