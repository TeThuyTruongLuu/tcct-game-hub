<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Bàn chơi TCG</title>
	<link rel="stylesheet" href="style.css" />
	<script type="module" src="firebase.js"></script>
	<script type="module" src="script.js"></script>
</head>
<body>
	<div id="lobby">
		<input type="text" id="nameInput" placeholder="Tên bạn" />
		<input type="text" id="roomInput" placeholder="Room ID" />
		<button id="joinBtn">Tham gia phòng</button>
	</div>

	<div class="play-area hidden">
		<div class="card-container" id="cardList"></div>
		<!-- Góc trái trên -->
		<div class="card-slot dashed z1p1"></div>
		<div class="card-slot solid z2p1"></div>
			<div class="card-slot solid z3p1"></div>
			<div class="card-stack z4p1">
			<div class="card" style="--i: 0;"></div>
			<div class="card" style="--i: 1;"></div>
			<div class="card" style="--i: 2;"></div>
			</div>
			<div class="card-vstack z5p1" style="transform: rotate(90deg);">
			<div class="card" style="--i: 0"></div>
			<div class="card" style="--i: 1;"></div>
			<div class="card" style="--i: 2;"></div>
			</div>
			<div class="card-hand p1 dashed z6p1"></div>

			<div class="line-group" style="transform: translateY(42vh);">
			<div class="line" style="width: 18%;"></div>
			<div class="line" style="width: 8%;"></div>
			<div class="line" style="width: 5%;"></div>
			</div>									

			<div class="line-group" style="transform: translateY(41vh) rotate(180deg);">
			<div class="line" style="width: 18%;"></div>
			<div class="line" style="width: 8%;"></div>
			<div class="line" style="width: 5%;"></div>
			</div>
			
		<!-- Góc phải dưới -->
		<div class="card-slot dashed z1p2"></div>
		<div class="card-slot solid z2p2"></div>
			<div class="card-slot solid z3p2"></div>
			<div class="card-stack z4p2">
			<div class="card" style="--i: 0;"></div>
			<div class="card" style="--i: 1;"></div>
			<div class="card" style="--i: 2;"></div>
			</div>
			<div class="card-vstack z5p2" style="transform: rotate(90deg);">
			<div class="card" style="--i: 0"></div>
			<div class="card" style="--i: 1;"></div>
			<div class="card" style="--i: 2;"></div>
			</div>
			<div class="card-hand p2 dashed z6p2"></div>

	</div>
</body>
</html>
