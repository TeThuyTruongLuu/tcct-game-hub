<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ghép hình</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
	<script src="../js/index.js"></script>
</head>

<body>
		<button onclick="window.location.href='https://tethuytruongluu.github.io/tcct-game-hub/'" 
				style="margin:10px;padding:8px 16px;background:#ff9e42;border:none;border-radius:6px;
					   font-size:14px;color:#fff;cursor:pointer;position:relative;z-index:2000;font-family: 'Quicksand', sans-serif;font-weight:bold;">
		  Trang chủ
		</button>
    <div class="game-wrapper">
        <div class="pieces-container left-container" id="left-container"></div>
        <div class="puzzle-board" id="puzzle-board">
            <div class="preview-overlay" id="preview-overlay"></div>
        </div>
        <div class="pieces-container right-container" id="right-container"></div>
    </div>
    <div class="pieces-container top-container" id="top-container"></div>
	<br>
    <div class="timer-container" id="timer">Thời gian chơi: 0 giây</div>
    <div class="question-container" id="question-container" style="display: none;">
        <h2 id="question-text">Chọn một mảnh ghép để bắt đầu giải câu hỏi!</h2>
        <div id="options"></div>
    </div>
	<button id="reset-btn">Chơi lại Level 1</button>
    <p style="margin-top: 20px;">Cre: Phong's commissions by Yummi & Jiro</p>
    <script src="script.js"></script>
</body>
</html>
