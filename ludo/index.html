<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ludo Board Redesign</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <script src="game.js"></script>
  <link rel="stylesheet" href="style.css">


</head>
<body>
  <div id="board">
    <!-- Home Areas with Images -->
	<div class="home red" style="grid-column: 1 / span 5; grid-row: 1 / span 5;">
	  <img src="img/Vuong_2.png" class="home-img" alt="Red House">
	  <div class="piece-wrapper">
		<div id="red-1" class="piece red"></div>
		<div id="red-2" class="piece red"></div>
		<div id="red-3" class="piece red"></div>
		<div id="red-4" class="piece red"></div>
	  </div>
	</div>
	
	<div class="home green" style="grid-column: 11 / span 5; grid-row: 1 / span 5;">
	  <img src="img/Cao.png" class="home-img" alt="Green House">
	  <div class="piece-wrapper">
		<div id="green-1" class="piece green"></div>
		<div id="green-2" class="piece green"></div>
		<div id="green-3" class="piece green"></div>
		<div id="green-4" class="piece green"></div>
	  </div>
	</div>

	<div class="home yellow" style="grid-column: 1 / span 5; grid-row: 11 / span 5;">
	  <img src="img/Chu.png" class="home-img" alt="Yellow House">
	  <div class="piece-wrapper">
		<div id="yellow-1" class="piece yellow"></div>
		<div id="yellow-2" class="piece yellow"></div>
		<div id="yellow-3" class="piece yellow"></div>
		<div id="yellow-4" class="piece yellow"></div>
	  </div>
	</div>

	<div class="home blue" style="grid-column: 11 / span 5; grid-row: 11 / span 5;">
	  <img src="img/Dvu.png" class="home-img" alt="Blue House">
	  <div class="piece-wrapper">
		<div id="blue-1" class="piece blue"></div>
		<div id="blue-2" class="piece blue"></div>
		<div id="blue-3" class="piece blue"></div>
		<div id="blue-4" class="piece blue"></div>
	  </div>
	</div>


    <!-- Start Positions -->
    <div class="cell start red" style="grid-column: 6; grid-row: 1;"></div>
    <div class="cell start yellow" style="grid-column: 1; grid-row: 10;"></div>
    <div class="cell start green" style="grid-column: 15; grid-row: 6;"></div>
    <div class="cell start blue" style="grid-column: 10; grid-row: 15;"></div>

	<div id="dice-box">
	  <div id="dice-canvas"></div>
	  <button onclick="rollDice()">🎲 Roll Dice</button>
	  <div id="dice-result">Kết quả sẽ hiện ở đây</div>
	</div>



	<script>
	  window.onload = function () {
		if (typeof initDice === 'function') {
		  initDice("dice-canvas", onDiceRolled);
		} else {
		  console.error("initDice chưa được define. Hãy chắc chắn game.js đã load đúng.");
		}
	  };
	</script>


    <!-- Path: Full clockwise layout including middle links -->
	<div class="cell path" id="cell-2-6" style="grid-column: 6; grid-row: 2;"></div>
	<div class="cell path" id="cell-3-6" style="grid-column: 6; grid-row: 3;"></div>
	<div class="cell path" id="cell-4-6" style="grid-column: 6; grid-row: 4;"></div>
	<div class="cell path" id="cell-5-6" style="grid-column: 6; grid-row: 5;"></div>
	<div class="cell path" id="cell-6-6" style="grid-column: 6; grid-row: 6;"></div>
	<div class="cell path" id="cell-11-6" style="grid-column: 6; grid-row: 11;"></div>
	<div class="cell path" id="cell-12-6" style="grid-column: 6; grid-row: 12;"></div>
	<div class="cell path" id="cell-13-6" style="grid-column: 6; grid-row: 13;"></div>
	<div class="cell path" id="cell-14-6" style="grid-column: 6; grid-row: 14;"></div>
	<div class="cell path" id="cell-15-6" style="grid-column: 6; grid-row: 15;"></div>
	<div class="cell path" id="cell-7-1" style="grid-column: 1; grid-row: 7;"></div>
	<div class="cell path" id="cell-8-1" style="grid-column: 1; grid-row: 8;"></div>
	<div class="cell path" id="cell-9-1" style="grid-column: 1; grid-row: 9;"></div>
	<div class="cell path" id="cell-1-10" style="grid-column: 10; grid-row: 1;"></div>
	<div class="cell path" id="cell-2-10" style="grid-column: 10; grid-row: 2;"></div>
	<div class="cell path" id="cell-3-10" style="grid-column: 10; grid-row: 3;"></div>
	<div class="cell path" id="cell-4-10" style="grid-column: 10; grid-row: 4;"></div>
	<div class="cell path" id="cell-5-10" style="grid-column: 10; grid-row: 5;"></div>
	<div class="cell path" id="cell-11-10" style="grid-column: 10; grid-row: 11;"></div>
	<div class="cell path" id="cell-12-10" style="grid-column: 10; grid-row: 12;"></div>
	<div class="cell path" id="cell-13-10" style="grid-column: 10; grid-row: 13;"></div>
	<div class="cell path" id="cell-14-10" style="grid-column: 10; grid-row: 14;"></div>
	<div class="cell path" id="cell-7-15" style="grid-column: 15; grid-row: 7;"></div>
	<div class="cell path" id="cell-8-15" style="grid-column: 15; grid-row: 8;"></div>
	<div class="cell path" id="cell-9-15" style="grid-column: 15; grid-row: 9;"></div>
	<div class="cell path" id="cell-1-7" style="grid-column: 7; grid-row: 1;"></div>
	<div class="cell path" id="cell-1-8" style="grid-column: 8; grid-row: 1;"></div>
	<div class="cell path" id="cell-1-9" style="grid-column: 9; grid-row: 1;"></div>
	<div class="cell path" id="cell-1-10" style="grid-column: 10; grid-row: 1;"></div>
	<div class="cell path" id="cell-6-1" style="grid-column: 1; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-2" style="grid-column: 2; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-3" style="grid-column: 3; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-4" style="grid-column: 4; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-5" style="grid-column: 5; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-10" style="grid-column: 10; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-11" style="grid-column: 11; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-12" style="grid-column: 12; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-13" style="grid-column: 13; grid-row: 6;"></div>
	<div class="cell path" id="cell-6-14" style="grid-column: 14; grid-row: 6;"></div>
	<div class="cell path" id="cell-10-2" style="grid-column: 2; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-3" style="grid-column: 3; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-4" style="grid-column: 4; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-5" style="grid-column: 5; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-6" style="grid-column: 6; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-10" style="grid-column: 10; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-11" style="grid-column: 11; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-12" style="grid-column: 12; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-13" style="grid-column: 13; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-14" style="grid-column: 14; grid-row: 10;"></div>
	<div class="cell path" id="cell-10-15" style="grid-column: 15; grid-row: 10;"></div>
	<div class="cell path" id="cell-15-7" style="grid-column: 7; grid-row: 15;"></div>
	<div class="cell path" id="cell-15-8" style="grid-column: 8; grid-row: 15;"></div>
	<div class="cell path" id="cell-15-9" style="grid-column: 9; grid-row: 15;"></div>


    <!-- Safe Paths 3 blocks each -->
	<div class="cell safe red" style="grid-column: 8; grid-row: 2;"></div>
    <div class="cell safe red" style="grid-column: 8; grid-row: 3;"></div>
    <div class="cell safe red" style="grid-column: 8; grid-row: 4;"></div>
    <div class="cell safe red" style="grid-column: 8; grid-row: 5;"></div>
	<div class="cell safe red" style="grid-column: 8; grid-row: 6;"></div>
	<div class="cell safe red" style="grid-column: 8; grid-row: 7;"></div>
	
	<div class="cell safe green" style="grid-column: 9; grid-row: 8;"></div>
    <div class="cell safe green" style="grid-column: 10; grid-row: 8;"></div>
    <div class="cell safe green" style="grid-column: 11; grid-row: 8;"></div>
    <div class="cell safe green" style="grid-column: 12; grid-row: 8;"></div>
	<div class="cell safe green" style="grid-column: 13; grid-row: 8;"></div>
	<div class="cell safe green" style="grid-column: 14; grid-row: 8;"></div>
	
	<div class="cell safe blue" style="grid-column: 8; grid-row: 9;"></div>
	<div class="cell safe blue" style="grid-column: 8; grid-row: 10;"></div>
    <div class="cell safe blue" style="grid-column: 8; grid-row: 11;"></div>
    <div class="cell safe blue" style="grid-column: 8; grid-row: 12;"></div>
    <div class="cell safe blue" style="grid-column: 8; grid-row: 13;"></div>
	<div class="cell safe blue" style="grid-column: 8; grid-row: 14;"></div>

	<div class="cell safe yellow" style="grid-column: 2; grid-row: 8;"></div>
    <div class="cell safe yellow" style="grid-column: 3; grid-row: 8;"></div>
    <div class="cell safe yellow" style="grid-column: 4; grid-row: 8;"></div>
    <div class="cell safe yellow" style="grid-column: 5; grid-row: 8;"></div>
	<div class="cell safe yellow" style="grid-column: 6; grid-row: 8;"></div>
	<div class="cell safe yellow" style="grid-column: 7; grid-row: 8;"></div>

  </div>
</body>
</html>
