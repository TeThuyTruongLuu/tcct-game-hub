<!-- PART 1: index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bắn Tàu PvP</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
	<h1>BẮN TÀU 1v1</h1>

	<div id="setup-container">
		<h2>Chọn nhân vật</h2>
		<div class="char-list"></div>

		<div class="input-group">
			<input type="text" id="username" placeholder="Tên người chơi">
		</div>

		<div class="input-group">
			<input type="password" id="password" placeholder="Mật khẩu">
			<span class="toggle-password" onclick="togglePassword()">👁</span>
		</div>

		<button id="start-button">Vào game</button>
	</div>

	<div id="loading" style="display: none; margin-top: 20px;">
		<p>Đang tải game, vui lòng đợi...</p>
	</div>
	
	<!-- PART 3: UI đặt tàu -->
	<div id="length-config-container" style="display: none;">
		<h2>Chia 7 ô cho tối đa 3 tàu</h2>
		<div class="ship-length-inputs">
			<div>
				<label for="ship1">Tàu 1</label><br>
				<input type="number" id="ship1" min="0" max="7" value="3">
			</div>
			<div>
				<label for="ship2">Tàu 2</label><br>
				<input type="number" id="ship2" min="0" max="7" value="2">
			</div>
			<div>
				<label for="ship3">Tàu 3</label><br>
				<input type="number" id="ship3" min="0" max="7" value="2">
			</div>
		</div>
		<div class="remaining-info">Còn lại: <span id="remaining-count">0</span> ô</div>
		<button id="confirm-ship-length">Xác nhận</button>
	</div>

	<div id="game-container" style="display:none;">
		<h2>Chọn ô để đặt tàu</h2>
		<p>Bấm từng ô theo thứ tự để đặt tàu (ngang hoặc dọc)</p>
		<div class="board" id="board"></div>
		<button id="save-board" style="margin-top: 16px;" disabled>🚀 Sẵn sàng chiến đấu</button>
	</div>

	<script type="module" src="index.js"></script>
</body>
</html>
