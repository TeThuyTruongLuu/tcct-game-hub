<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bắn tàu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <h1>Bắn tàu chíu chíu</h1>

  <div id="setup-container">
    <h2>Chọn mặt tàu</h2>
    <div class="char-list">
      <div class="char-option" data-char="Vuong" data-img="../2048/images/Vuong_3.jpg">
        <img src="../2048/images/Vuong_3.jpg" alt="Vuong">
      </div>
      <div class="char-option" data-char="Lac" data-img="../2048/images/Lac_6.jpg">
        <img src="../2048/images/Lac_6.jpg" alt="Lac">
      </div>
      <div class="char-option" data-char="Khuu" data-img="../2048/images/Khuu_2.jpg">
        <img src="../2048/images/Khuu_2.jpg" alt="Khuu">
      </div>
    </div>

    <h2>Thông tin chủ tàu</h2>
    <p id="greeting"></p>
    <div class="input-group">
      <input type="password" id="player-password" placeholder="Nhập mật khẩu">
      <img src="eye-icon.svg" alt="Hiện mật khẩu" class="toggle-password" onclick="togglePassword()">
    </div>
    <button id="start-game">Bắt đầu chơi</button>
  </div>

  <div id="length-config-container">
    <h2>Cấu hình độ dài tàu</h2>
    <p>Chia 7 ô tàu cho tối đa 3 tàu. Mỗi tàu dài từ 2–7 ô.</p>
    <div class="ship-length-inputs">
      <div>
        <label for="ship1">Tàu 1</label><br>
        <input type="number" id="ship1" min="0" max="7" value="3">
      </div>
      <div>
        <label for="ship2">Tàu 2</label><br>
        <input type="number" id="ship2" min="0" max="7" value="2">
      </div>
      <div>
        <label for="ship3">Tàu 3</label><br>
        <input type="number" id="ship3" min="0" max="7" value="2">
      </div>
    </div>
    <div class="remaining-info">Còn lại: <span id="remaining-count">0</span> ô</div>
    <button id="confirm-ship-length">Xác nhận</button>
  </div>

  <div id="game-container" style="display:none;">
    <h2>Thông tin tàu của bạn</h2>
    <div class="board" id="board"></div>
    <button id="save-board">Lưu bảng</button>
  </div>

  <!-- Fire Board Screen -->
  <div id="fire-container" style="display:none;">
    <h2>Bắn tàu mỗi ngày</h2>
    <p>Chọn tối đa 5 ô để bắn mỗi ngày.</p>
    <div class="board" id="fire-board"></div>
    <div id="shot-result" style="margin-top: 20px; font-size: 16px; color: #333;"></div>
    <button id="save-fire-shots">💣 Lưu lượt bắn</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBtpLSSNBj9lHtzibLh5QSRAPg3iQ46Q3g",
      authDomain: "tcct-minigames.firebaseapp.com",
      projectId: "tcct-minigames",
      storageBucket: "tcct-minigames.appspot.com",
      messagingSenderId: "604780847536",
      appId: "1:604780847536:web:f8015bde5ef469b04c7675"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const BOARD_COLS = 20;
    const BOARD_ROWS = 15;
    const MAX_SHIPS = 4;
    let placedShips = 0;
    let selectedChar = null;
    let selectedImg = '';
    let username = localStorage.getItem("username") || prompt("Nhập username của bạn:");

    localStorage.setItem("username", username);
    document.getElementById("greeting").innerText = `Xin chào ${username}!`;

    document.querySelectorAll('.char-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.char-option').forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        selectedChar = option.dataset.char;
        selectedImg = option.dataset.img;
      });
    });

    function togglePassword() {
      const pwField = document.getElementById('player-password');
      pwField.type = pwField.type === 'password' ? 'text' : 'password';
    }

    async function checkUserAndStart() {
      const password = document.getElementById('player-password').value;
      if (!selectedChar || !password) {
        alert('Vui lòng chọn nhân vật và nhập mật khẩu.');
        return;
      }

      try {
        const userRef = db.collection("users").doc(username);
        const doc = await userRef.get();

        if (doc.exists) {
          const savedPassword = doc.data().password;
          if (savedPassword) {
            if (password !== savedPassword) {
              alert("Sai mật khẩu. Hãy thử lại.");
              return;
            }
          } else {
            await userRef.set({ password, char: selectedChar }, { merge: true });
          }
        } else {
          await userRef.set({ username, password, char: selectedChar });
        }

        const savedChar = doc.data().char;
        if (savedChar) {
          document.querySelectorAll('.char-option').forEach(opt => {
            if (opt.dataset.char === savedChar) {
              opt.classList.add('selected');
              selectedChar = opt.dataset.char;
              selectedImg = opt.dataset.img;
            } else {
              opt.style.pointerEvents = 'none';
              opt.style.opacity = '0.4';
            }
          });
        }

        document.getElementById("setup-container").style.display = "none";

        if (doc.exists && doc.data().shipPositions) {
          document.getElementById("game-container").style.display = "block";
          const positions = doc.data().shipPositions || [];
          positions.forEach(idx => {
            const cell = document.querySelector(`[data-index='${idx}']`);
            cell.classList.add("occupied");
            cell.style.backgroundImage = `url('${selectedImg}')`;
          });
          document.querySelectorAll(".cell").forEach(cell => {
            const newCell = cell.cloneNode(true);
            cell.parentNode.replaceChild(newCell, cell);
          });
          document.getElementById("save-board").style.display = "none";
          document.getElementById("board").insertAdjacentHTML("afterend", `
            <button id="start-battle" style="margin-top: 20px">🚀 Bắt đầu bắn tàu</button>
          `);
          document.getElementById("start-battle").addEventListener("click", () => {
            document.getElementById("game-container").style.display = "none";
            initFireBoard();
          });
        } else {
          document.getElementById("length-config-container").style.display = "block";
        }
      } catch (e) {
        console.error(e);
        alert("Lỗi khi kiểm tra tài khoản.");
      }
    }

    document.getElementById('start-game').addEventListener('click', checkUserAndStart);

    document.getElementById('player-password').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('start-game').click();
      }
    });

    const shipInputs = [
      document.getElementById('ship1'),
      document.getElementById('ship2'),
      document.getElementById('ship3')
    ];
    const remainingDisplay = document.getElementById('remaining-count');
    const confirmBtn = document.getElementById('confirm-ship-length');
    const maxTotal = 7;

    function updateRemaining() {
      let total = 0;
      shipInputs.forEach(input => {
        const val = parseInt(input.value) || 0;
        total += val;
      });
      const remaining = maxTotal - total;
      remainingDisplay.textContent = remaining;

      shipInputs.forEach(input => {
        const otherTotal = total - parseInt(input.value || 0);
        input.max = Math.min(7, maxTotal - otherTotal);
        input.min = 0;
      });

      const validShips = shipInputs.map(i => parseInt(i.value)).filter(x => x >= 2);
      confirmBtn.disabled = !(total === maxTotal && validShips.length >= 1);
    }

    shipInputs.forEach(input => input.addEventListener('input', updateRemaining));
    updateRemaining();

    confirmBtn.addEventListener('click', () => {
      const lengths = shipInputs.map(i => parseInt(i.value)).filter(x => x >= 2);
      localStorage.setItem('shipLengths', JSON.stringify(lengths));

      document.getElementById('length-config-container').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      console.log('Độ dài tàu đã chọn:', lengths);

      const totalCells = BOARD_COLS * BOARD_ROWS;
      const occupied = new Set();
      const directions = ['H', 'V'];
      const positions = [];

      function isValid(start, length, dir) {
        for (let i = 0; i < length; i++) {
          let idx = dir === 'H' ? start + i : start + i * BOARD_COLS;
          if (
            idx >= totalCells ||
            (dir === 'H' && Math.floor(idx / BOARD_COLS) !== Math.floor(start / BOARD_COLS)) ||
            occupied.has(idx)
          ) return false;
        }
        return true;
      }

      function placeShip(length) {
        let tries = 100;
        while (tries--) {
          let dir = directions[Math.floor(Math.random() * directions.length)];
          let maxStart = dir === 'H' ? totalCells - length : totalCells - length * BOARD_COLS;
          let start = Math.floor(Math.random() * maxStart);
          if (isValid(start, length, dir)) {
            for (let i = 0; i < length; i++) {
              let idx = dir === 'H' ? start + i : start + i * BOARD_COLS;
              occupied.add(idx);
              positions.push(idx);
              const cell = document.querySelector(`[data-index='${idx}']`);
              cell.classList.add('occupied');
              cell.style.backgroundImage = `url('${selectedImg}')`;
            }
            return;
          }
        }
        console.warn('Không thể đặt tàu với chiều dài:', length);
      }

      lengths.forEach(placeShip);

      db.collection("users").doc(username).set({
        shipConfig: lengths,
        shipPositions: positions,
        char: selectedChar
      }, { merge: true });
    });

    const board = document.getElementById("board");
    for (let i = 0; i < BOARD_COLS * BOARD_ROWS; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.index = i;
      cell.addEventListener("click", () => {
        if (cell.classList.contains("occupied")) {
          cell.classList.remove("occupied");
          cell.style.backgroundImage = "";
          placedShips--;
        } else {
          if (placedShips < MAX_SHIPS) {
            cell.classList.add("occupied");
            cell.style.backgroundImage = `url('${selectedImg}')`;
            placedShips++;
          } else {
            alert("Bạn đã đặt đủ tàu!");
          }
        }
      });
      board.appendChild(cell);
    }

    function saveShipDataAnd(next) {
      const shipConfig = JSON.parse(localStorage.getItem('shipLengths'));
      const shipPositions = Array.from(document.querySelectorAll('.cell.occupied'))
        .map(cell => parseInt(cell.dataset.index));
      db.collection("users").doc(username).set({
        shipConfig,
        shipPositions,
        char: selectedChar
      }, { merge: true }).then(() => {
        alert("Đã lưu thông tin tàu thành công!");
        if (next === 'menu') location.reload();
        else if (next === 'play') alert("Chuyển sang chế độ bắn tàu... (đang phát triển)");
      });
    }

    document.getElementById("save-board").addEventListener("click", () => {
      alert("Bảng đã được lưu! Chia sẻ đường dẫn để bạn bè cùng chơi nhé.");
    });

    async function initFireBoard() {
      const fireContainer = document.getElementById('fire-container');
      const fireBoard = document.getElementById('fire-board');
      const saveFireBtn = document.getElementById('save-fire-shots');
      const resultDisplay = document.getElementById('shot-result');
      fireBoard.innerHTML = '';
      let fireSelected = [];

      // Load previous shot result if available
      const lastResult = JSON.parse(localStorage.getItem('lastShotResult') || '{}');
      if (lastResult.date === new Date().toISOString().split('T')[0]) {
        resultDisplay.innerHTML = `
          <p>Kết quả lượt bắn hôm nay:</p>
          <ul>
            <li>Trúng tàu đối thủ: ${lastResult.hit} ô</li>
            <li>Tự bắn tàu mình: ${lastResult.self} ô</li>
            <li>Bắn trượt: ${lastResult.miss} ô</li>
          </ul>
        `;
      } else {
        resultDisplay.innerHTML = '';
      }

      const dateStr = new Date().toISOString().split('T')[0];
      const allHistory = await db.collection('fireShots').doc(username).get();
      const pastShots = {};
      let totalShotCount = 0;

      if (allHistory.exists) {
        const data = allHistory.data();
        if (data[dateStr]) {
          const shots = data[dateStr].result || {};
          for (let idx in shots) {
            pastShots[idx] = shots[idx];
            totalShotCount++;
          }
        }
      }

      if (totalShotCount >= 5) {
        saveFireBtn.disabled = true;
        saveFireBtn.textContent = 'Đã bắn đủ hôm nay';
      }

      for (let i = 0; i < BOARD_COLS * BOARD_ROWS; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;

        if (pastShots[i]) {
          cell.classList.add('fired');
          if (pastShots[i] === 'hit') {
            cell.style.backgroundColor = '#ff6666';
          } else if (pastShots[i] === 'self') {
            cell.style.backgroundColor = '#cc99ff';
          } else {
            cell.style.backgroundColor = '#aaa';
          }
        } else {
          cell.addEventListener('click', () => {
            const index = parseInt(cell.dataset.index);
            if (cell.classList.contains('fired')) {
              return;
            }
            if (fireSelected.includes(index)) {
              cell.style.backgroundColor = '';
              fireSelected = fireSelected.filter(x => x !== index);
            } else {
              if (fireSelected.length + totalShotCount < 5) {
                fireSelected.push(index);
                cell.style.backgroundColor = '#87ceeb';
              } else {
                alert('Tối đa 5 ô/ngày. Bạn đã bắn đủ!');
              }
            }
          });
        }

        fireBoard.appendChild(cell);
      }

      fireContainer.style.display = 'block';

      saveFireBtn.onclick = async () => {
        if (fireSelected.length === 0) {
          alert('Bạn chưa chọn ô nào để bắn.');
          return;
        }

        const result = {};
        const allUsers = await db.collection('users').get();
        const otherShips = [];
        let selfShips = [];

        allUsers.forEach(doc => {
          const data = doc.data();
          if (data.shipPositions && data.shipPositions.length > 0) {
            if (doc.id === username) selfShips = data.shipPositions;
            else otherShips.push(...data.shipPositions);
          }
        });

        fireSelected.forEach(idx => {
          if (selfShips.includes(idx)) result[idx] = 'self';
          else if (otherShips.includes(idx)) result[idx] = 'hit';
          else result[idx] = 'miss';
        });

        await db.collection('fireShots').doc(username).set({
          [dateStr]: {
            shots: fireSelected,
            result,
          }
        }, { merge: true });

        fireSelected.forEach(idx => {
          const cell = document.querySelector(`#fire-board .cell[data-index='${idx}']`);
          const type = result[idx];
          if (type === 'self') cell.style.backgroundColor = '#cc99ff';
          else if (type === 'hit') cell.style.backgroundColor = '#ff6666';
          else cell.style.backgroundColor = '#aaa';
          cell.classList.add('fired');
        });

        // Calculate and display shot results
        const hitCount = Object.values(result).filter(v => v === 'hit').length;
        const selfCount = Object.values(result).filter(v => v === 'self').length;
        const missCount = Object.values(result).filter(v => v === 'miss').length;
        
        // Save result to localStorage for persistence
        localStorage.setItem('lastShotResult', JSON.stringify({
          date: dateStr,
          hit: hitCount,
          self: selfCount,
          miss: missCount
        }));

        // Display result on screen
        resultDisplay.innerHTML = `
          <p>Kết quả lượt bắn hôm nay:</p>
          <ul>
            <li>Trúng tàu đối thủ: ${hitCount} ô</li>
            <li>Tự bắn tàu mình: ${selfCount} ô</li>
            <li>Bắn trượt: ${missCount} ô</li>
          </ul>
        `;

        // Show alert with summary
        alert(`Lượt bắn đã được lưu!\nKết quả:\n- Trúng: ${hitCount} ô\n- Tự bắn: ${selfCount} ô\n- Trượt: ${missCount} ô`);

        totalShotCount += fireSelected.length;
        fireSelected = [];

        if (totalShotCount >= 5) {
          saveFireBtn.disabled = true;
          saveFireBtn.textContent = 'Đã bắn đủ hôm nay';
        }

        await initFireBoard();
      };
    }

    function highlightSunkShips(resultMap, selfShips) {
      const shipConfig = selfShips || [];
      const sunkShips = [];

      const shipCells = shipConfig.reduce((acc, len, idx) => {
        acc[idx] = [];
        return acc;
      }, {});

      for (const idx in resultMap) {
        if (resultMap[idx] === 'self') {
          document.querySelector(`#fire-board .cell[data-index='${idx}']`).classList.add('fired');
        }
      }

      const cellEls = document.querySelectorAll('#fire-board .cell');
      const hitSet = new Set(Object.keys(resultMap).filter(k => resultMap[k] === 'hit'));

      db.collection("users").get().then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
          const ship = data.shipPositions || [];
          const face = data.char;
          if (ship.length > 0 && ship.every(pos => hitSet.has(pos.toString()))) {
            ship.forEach(pos => {
              const el = document.querySelector(`#fire-board .cell[data-index='${pos}']`);
              if (el) {
                el.style.backgroundImage = `url('../2048/images/${face}_3.jpg')`;
                el.style.border = '2px solid black';
                el.style.backgroundSize = 'cover';
              }
            });
          }
        });
      });
    }
  </script>
</body>
</html>
