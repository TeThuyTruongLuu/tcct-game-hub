<div class="album-container">
    <div class="album-header">
        <h2>Album Sưu Tầm Goods</h2>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0/0 Thẻ</div>
    </div>

    <div id="album-grid" class="album-grid"></div>

    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-button">&times;</span>
            <h3 id="modal-card-name"></h3>
            <p id="modal-collection-name"></p>
            
            <div class="modal-image-container">
                <img id="modal-card-image" src="" alt="Card Image">
            </div>

            <div id="modal-action-zone">
                <button id="btn-manual-own" class="btn btn-primary">Xác nhận tay</button>
                <button id="btn-camera-scan" class="btn btn-secondary">Quét Camera</button>
            </div>

            <div id="modal-owned-zone" class="hidden">
                <div class="note-section">
                    <label for="modal-note-input">Ghi chú của bạn:</label>
                    <textarea id="modal-note-input" rows="3"></textarea>
                </div>
                <button id="btn-take-photo" class="btn btn-success">Chụp ảnh thực tế</button>
                <button id="btn-save-details" class="btn btn-primary">Lưu thay đổi</button>
            </div>
        </div>
    </div>
</div>
