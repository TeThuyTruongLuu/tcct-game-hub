<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
    <title>Tung đồng xu</title>
    <style>
		body {
			font-family: 'Quicksand', sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			background: radial-gradient(circle, #ffebef, #ffcccc);
		}

		h1 {
			font-size: 32px;
			color: #d48806;
			margin-bottom: 20px;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
		}

		.coin-container {
			width: 220px;
			aspect-ratio: 1/1;
			position: relative;
			perspective: 1200px;
			margin-bottom: 30px;
		}
		
		.coin {
			position: relative;
			width: 100%;
			height: 100%;
			transform-style: preserve-3d;
			transition: transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
		}

		.coin::after{
			content:"";
			position:absolute;
			inset:-2px;
			border-radius:50%;
			background: radial-gradient(circle at 30% 30%, #fff59d, #ffeb3b, #fbc02d);
			-webkit-mask: radial-gradient(closest-side, transparent calc(100% - 12px), #000 calc(100% - 4px));
			mask: radial-gradient(closest-side, transparent calc(100% - 12px), #000 calc(100% - 4px));
			z-index:1;
			pointer-events:none;
		}
				
		.coin img{
			position:absolute;
			width:100%;
			height:100%;
			border-radius:50%;
			object-fit:cover;
			backface-visibility:hidden;
			z-index:1;
		}
		
		.heads { transform: rotateX(0deg); }
		.tails { transform: rotateX(180deg); }

		.flip-button {
			padding: 12px 28px;
			background-color: #d48806;
			color: white;
			border: none;
			border-radius: 25px;
			cursor: pointer;
			font-size: 18px;
			font-weight: bold;
			transition: all 0.2s ease-in-out;
		}
		.flip-button:hover { background-color: #b36b00; }

		.controls {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 16px;
			margin-bottom: 20px;
		}

		select#coinSet {
			padding: 10px 14px;
			border: 2px solid #d47b00;
			border-radius: 25px;
			background: #fff8f0;
			font-size: 16px;
			color: #333;
			cursor: pointer;
		}

		.upload-container {
			margin-top: 25px;
			padding: 20px;
			background: white;
			border-radius: 12px;
			box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
			max-width: 600px;
			width: 90%;
			text-align: center;
		}

		.upload-row {
			display: flex;
			justify-content: center;
			gap: 40px;
		}

		.upload-box {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		label {
			font-weight: bold;
			color: #b36b00;
			margin-bottom: 8px;
		}

		input[type="file"] {
		margin-top: 5px;
			display: block;
			padding: 6px;
			border: 2px solid #d47b00;
			border-radius: 12px;
			background: #fff8f0;
			font-size: 14px;
			color: #333;
			cursor: pointer;
			width: fit-content;
		}

		input[type="file"]::-webkit-file-upload-button {
			background: #d47b00;
			color: #fff;
			border: none;
			border-radius: 10px;
			padding: 6px 12px;
			cursor: pointer;
			font-size: 14px;
			transition: background 0.2s;
		}
		input[type="file"]::-webkit-file-upload-button:hover {
			background: #a55c00;
		}

		.credit { margin-bottom: -2px; }
		@media (max-width: 600px) {
			.upload-row {
				flex-direction: column;
				gap: 20px;
			}
			.upload-container {
				width: 95%;
				padding: 15px;
			}
			input[type="file"] {
				max-width: 100%;
			}
		}
    </style>
</head>
<body>
    <h1>Tung đồng xu</h1>
    <div class="coin-container">
        <div class="coin" id="coin">
            <img src="img/head.jpg" class="heads" id="heads">
            <img src="img/tail.jpg" class="tails" id="tails">
        </div>
    </div>
	<div class="controls">
		<button class="flip-button" onclick="flipCoin()">Flip</button>
		<select id="coinSet">
			<option value="default">Mặc định</option>
			<option value="ywz">Dụ Văn Châu</option>
			<option value="yx">Diệp Tu</option>
			<option value="hwq">Hàn Văn Thanh</option>
			<option value="zjl">Trương Giai Lạc</option>
			<option value="szp">Tôn Triết Bình</option>
		</select>
	</div>
	<p class="credit" style="text-align:center">Cre ảnh mặc định: Phong's commission by <a href="https://www.facebook.com/ngoc.khanh.948118">Ngoc Khanh</a></p>
	<p class="credit" style="text-align:center">Cre ảnh khác: All rights reserved Yuewen©️</p>

    <p></p>
	<div class="upload-container">
		<div class="upload-row">
			<div class="upload-box">
				<label for="uploadHeads">Tải lên mặt trước:</label>
				<input type="file" id="uploadHeads" accept="image/*" onchange="updateImage('heads', event)">
			</div>
			<div class="upload-box">
				<label for="uploadTails">Tải lên mặt sau:</label>
				<input type="file" id="uploadTails" accept="image/*" onchange="updateImage('tails', event)">
			</div>
		</div>
	</div>
	
    <script>
		function flipCoin() {
			let coin = document.getElementById("coin");
			let isHeads = Math.random() < 0.5;
			let spins = (5 + Math.floor(Math.random() * 4)) * 360;
			let extra = isHeads ? 0 : 180;
			let totalRotation = spins + extra;

			coin.style.transition = "none";
			coin.style.transform = "rotateX(0deg)";

			void coin.offsetWidth;

			coin.style.transition = "transform 1.8s cubic-bezier(0.25, 1, 0.5, 1)";
			coin.style.transform = `rotateX(${totalRotation}deg)`;
		}
		
		const coinSets={
			"default":{head:"img/head.jpg",tail:"img/tail.jpg"},
			"ywz":{head:"img/ywz_head.jpeg",tail:"img/ywz_tail.jpeg"},
			"zjl":{head:"img/zjl_head.jpg",tail:"img/zjl_tail.jpeg"},
			"szp":{head:"img/szp_head.jpeg",tail:"img/szp_tail.jpeg"},
			"yx":{head:"img/yx_head.jpeg",tail:"img/yx_tail.jpeg"},
			"hwq":{head:"img/hwq_head.jpeg",tail:"img/hwq_tail.jpeg"},
			"ywz":{head:"img/ywz_head.jpeg",tail:"img/ywz_tail.jpeg"}
		};
		function applySet(key){
			const set=coinSets[key];
			document.getElementById("heads").src=set.head;
			document.getElementById("tails").src=set.tail;
		}
		document.getElementById("coinSet").addEventListener("change",e=>applySet(e.target.value));
		applySet("default");

        function updateImage(side, event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(side).src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
