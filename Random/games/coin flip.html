<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
    <title>Tung đồng xu</title>
    <style>
		body {
			font-family: 'Quicksand', sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			background: radial-gradient(circle, #ffebef, #ffcccc);
		}

		h1 {
			font-size: 32px;
			color: #d48806;
			margin-bottom: 20px;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
		}

		.coin-container {
			width: 220px;
			height: 220px;
			position: relative;
			perspective: 1200px;
			margin-bottom: 30px;
		}

		.coin {
			width: 100%;
			height: 100%;
			position: absolute;
			transform-style: preserve-3d;
			transition: transform 1.8s cubic-bezier(0.25, 1, 0.5, 1); /* Mượt hơn */
		}

		.coin img {
			width: 100%;
			height: 100%;
			border-radius: 50%;
			border: 1px solid gold;
			position: absolute;
			backface-visibility: hidden;
			object-fit: cover;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
			background: linear-gradient(145deg, #e6c200, #ffdf4f, #c79a00);
		}

		.heads {
			transform: rotateX(0deg);
		}

		.tails {
			transform: rotateX(180deg);
		}

        .flip-button {
            margin-top: 15px;
            padding: 14px 30px;
            background-color: #d48806;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
        }
        .flip-button:hover {
            background-color: #b36b00;
        }
        .upload-container {
            margin-top: 40px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        label {
            font-weight: bold;
            color: #b36b00;
            display: block;
            margin-top: 0.5vw;
        }
        input[type="file"] {
            margin-top: 5px;
        }
		.credit {margin-bottom: -2px;}
    </style>
</head>
<body>
    <h1>Tung đồng xu</h1>
    <div class="coin-container">
        <div class="coin" id="coin">
            <img src="img/head.jpg" class="heads" id="heads">
            <img src="img/tail.jpg" class="tails" id="tails">
        </div>
    </div>
    <button class="flip-button" onclick="flipCoin()">Flip</button>
	<p class="credit" style="text-align:center">Cre ảnh mặc định:<br>Phong's commission by <a href="https://www.facebook.com/ngoc.khanh.948118">Ngoc Khanh</a></p>

    <p></p>
    <div>
        <label for="uploadHeads">Tải lên mặt trước:</label>
        <input type="file" id="uploadHeads" accept="image/*" onchange="updateImage('heads', event)">
        <br>
        <label for="uploadTails">Tải lên mặt sau:</label>
        <input type="file" id="uploadTails" accept="image/*" onchange="updateImage('tails', event)">
    </div>
    
    <script>
		function flipCoin() {
			let coin = document.getElementById("coin");
			let isHeads = Math.random() < 0.5;
			let spins = (5 + Math.floor(Math.random() * 4)) * 360;
			let extra = isHeads ? 0 : 180;
			let totalRotation = spins + extra;

			coin.style.transition = "none";
			coin.style.transform = "rotateX(0deg)";

			void coin.offsetWidth;

			coin.style.transition = "transform 1.8s cubic-bezier(0.25, 1, 0.5, 1)";
			coin.style.transform = `rotateX(${totalRotation}deg)`;
		}



        function updateImage(side, event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(side).src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
