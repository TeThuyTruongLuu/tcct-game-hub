<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Gương Nói Chuyện</title>
	<link rel="stylesheet" href="styles.css"/>
</head>
<body>
	<video id="video" autoplay muted playsinline></video>
	<img id="character" class="character" src="6132779.png" alt="character" />
	<div id="speech" class="speech" style="display:none"></div>
	<div class="controls">
		<select id="characterSelect" aria-label="Chọn nhân vật">
			<option value="artem">Artem</option>
			<option value="ywz">Dụ Văn Châu</option>
		</select>
		<button id="btnStart">🎤 Bắt đầu nghe</button>
		<button id="btnStop" class="secondary">⏹️ Dừng nghe</button>
		<button id="btnTest" class="success">Test</button>
	</div>
	<script src="app.js"></script>
</body>
</html>
