<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Á há há</title>
	<link rel="stylesheet" href="styles.css"/>
	<script type="module">
		import { FilesetResolver, HandLandmarker } from "https://unpkg.com/@mediapipe/tasks-vision@0.10.20/vision_bundle.mjs";
		window.FilesetResolver = FilesetResolver;
		window.HandLandmarker = HandLandmarker;
	</script>
</head>
<body>
	<video id="video" autoplay muted playsinline></video>
	<img id="character" class="character" alt="character" />
	<div id="speech" class="speech" style="display:none"></div>
	<div class="controls">
		<select id="characterSelect" aria-label="Chọn nhân vật">
			<option value="artem">Artem</option>
			<option value="ywz">Dụ Văn Châu</option>
		</select>
		<button id="btnStart">🎤 Bắt đầu nghe</button>
		<button id="btnStop" class="secondary">🚫 Dừng nghe</button>
		<button id="btnTest" class="success">Test</button>
	</div>
	<div id="hint" class="hint"></div>
	<script src="app.js"></script>
</body>
</html>
