<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gương Nói Chuyện</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: sans-serif;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .character {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* Chỉ hiện khi chuyển từ camera sang ảnh */
    }
    .speech {
      position: absolute;
      bottom: 25%;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1.2em;
    }
    button {
      position: absolute;
      top: 10px;
      background: white;
      color: black;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    #testButton {
      position: absolute;
      bottom: 10%;
      background: #4CAF50;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <img id="character" class="character" src="6132779.png">
  <div id="speech" class="speech" style="display:none"></div>
  <button onclick="startListening()">🎤 Bắt đầu nghe</button>
  <button id="testButton" onclick="triggerTest()">Test</button>

  <script>
    const video = document.getElementById('video');
    const character = document.getElementById('character');
    const speech = document.getElementById('speech');
    const sound = new Audio('Artem.mp3'); // Âm thanh từ file bồ đã tải lên

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video.srcObject = stream;
    }

    function speak(text, lang) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      speechSynthesis.speak(utterance);
    }

    function triggerTest() {
      // Chuyển từ camera sang ảnh full màn hình
      video.style.display = 'none';
      character.style.display = 'block';
      speech.innerText = 'Chào bạn!';
      speech.style.display = 'block';

      // Phát âm thanh
      sound.play();
    }

    startCamera();
  </script>
</body>
</html>
