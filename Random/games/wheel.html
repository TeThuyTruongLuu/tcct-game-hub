<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng quay may mắn</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #ffebef;
            font-family: 'Quicksand', sans-serif;
        }
        .main-container {
            display: grid;
            grid-template-columns: minmax(250px, 1fr) minmax(300px, 2fr) minmax(250px, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .main-container.single-column .control-panel {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .control-panel h3 {
            color: #ff4081;
            margin-top: 0;
            text-align: center;
        }
        .page-title {
            text-align: center;
            margin-bottom: 12px;
        }
        .wheel-container {
            width: 460px;
            height: 460px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
			margin-top: 6px; margin-bottom: 6px;
        }
        #wheelCanvas {
            width: 420px !important;
            height: 420px !important;
            max-width: 100%;
            max-height: 100%;
            transform-origin: 50% 50%;
            transition: transform 0.1s linear;
        }
        .spin-button {
            margin-top: 0px;
            padding: 12px 26px;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.15s ease-in-out;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 8px 18px rgba(255,64,129,0.18);
        }
        .spin-button:hover {
            background-color: #e0356f;
        }
        .input-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        textarea {
            width: 220px;
            height: 100px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px;
            text-align: left;
            white-space: pre-line;
            font-size: 14px;
            outline: none;
        }
        .question-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .question-container select, 
        .question-container input {
            width: 220px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .question-container input {
            box-sizing: border-box;
        }
        .set-selection select,
        #questionSetTop {
            width: 100%;
            max-width: 320px;
            padding: 10px 12px;
            border: 2px solid rgba(255,64,129,0.15);
            border-radius: 12px;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            margin-bottom: 5px;
            background-color: white;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255,64,129,0.06);
            color: #333;
        }
        .set-selection select:focus, #questionSetTop:focus {
            outline: none;
            border-color: #ff8aa0;
            box-shadow: 0 6px 18px rgba(255,64,129,0.12);
        }
        .question-list {
            margin: 15px 0;
        }
        .question-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid rgba(255,64,129,0.18);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: grab;
            gap: 10px;
        }
        .question-item .drag-handle {
            cursor: grab;
            padding: 6px 8px;
            color: #ff4081;
            border-radius: 6px;
            background: rgba(255,64,129,0.06);
            font-weight: 700;
        }
        .question-item .remove-btn {
            margin-left: auto;
            color: #ff4081;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 18px;
        }
        .action-button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-button.add {
            background-color: #ff4081;
            color: white;
        }
        .action-button.add:hover {
            background-color: #e0356f;
        }
        .current-question {
            text-align: center;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: #ff4081;
        }
        .predefined-answers {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
			gap: 6px;
        }
        
        .name-input {
            width: 360px;
            max-width: calc(100% - 40px);
            height: 120px;
            border-radius: 10px;
            border: 1px solid #f0c0d0;
            padding: 12px;
            resize: vertical;
            font-family: 'Quicksand', sans-serif;
            margin-top: 18px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            min-width: 300px;
        }
        .modal-header {
            color: white;
            padding: 15px;
            font-size: 18px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .modal-footer {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .close-button {
            float: right;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Quicksand', sans-serif;
        }
        .modal-button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .modal-button.close {
            background-color: #ccc;
        }
        .modal-button.close:hover {
            background-color: #b3b3b3;
        }
        .modal-button.remove {
            background-color: #ff4081;
            color: white;
            font-family: 'Quicksand', sans-serif;
        }
        .modal-button.remove:hover {
            background-color: #e0356f;
        }
        .modal-button.secondary {
            background-color: #ff4081;
            color: white;
        }
        .modal-button.neutral {
            background-color: #ccc;
            color: #222;
        }
        .arrow {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%) rotate(90deg);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid red;
            z-index: 10;
        }
		.palette-column {
			display:flex;
			flex-direction:column;
			width:100%;
			max-width:340px;
			margin:0 auto;
			border-radius:5px;
			overflow:hidden;
			box-shadow:0 2px 8px rgba(0,0,0,.08);
			background:#fff;
		}

		.palette-block {
			height:90px;
			display:flex;
			align-items:center;
			justify-content:center;
			font-weight:700;
			font-size:14px;
			color:#fff;
			position:relative;
			cursor:pointer;
			user-select:none;
			transition:filter .15s ease;
		}

		.palette-block.locked::after {
			content:"🔒";
			position:absolute;
			right:10px;
			top:50%;
			transform:translateY(-50%);
			font-size:14px;
		}
		@media (max-width:700px) {
			.palette-column {max-width:300px;}
			.palette-block {height:64px;font-size:13px;}
		}

		@media (max-width:480px) {
			.palette-column {max-width:240px;}
			.palette-block {height:58px;font-size:12px;}
		}
    </style>
    <style>
		@media (max-width: 600px) {
			.main-container {
				grid-template-columns:
				  clamp(84px, 24vw, 118px)
				  minmax(clamp(180px, 52vw, 1fr), 1fr)
				  clamp(84px, 24vw, 118px) !important;
				gap: 8px;
				padding: 8px;
				max-width: 100%;
				align-items: start;
			}
			.left-panel, .right-panel {
				padding: 8px;
				box-sizing: border-box;
				max-width: unset;
				height: auto;
				max-height: calc(100dvh - 140px);
				overflow: auto;
				-webkit-overflow-scrolling: touch;
			}
			.center-panel {
				gap: 8px;
				padding: 4px;
			}
			.wheel-container {
				width: min(70vw, 320px) !important;
				aspect-ratio: 1 / 1;
				margin: 8px auto;
			}
			#wheelCanvas { width: 100% !important; height: auto !important; 
			max-width: 100%; display: block; transform-origin: 50% 50%;
			transition: transform 0.1s linear; }
			.arrow {
				left: calc(100% - 6px);
				border-left: 10px solid transparent;
				border-right: 10px solid transparent;
				border-top: 18px solid red;
			}
			.spin-button {
				width: 90%;
				max-width: 340px;
				font-size: 16px;
				padding: 12px 18px;
				touch-action: manipulation;
			}	
			.name-input {
				width: 95%;
				height: 84px;
				font-size: 16px;
			}
			.question-list,
			.predefined-answers {
				max-height: calc(100dvh - 220px);
				overflow: auto;
			}
			.modal {
				width: 92vw;
				max-width: 360px;
				word-wrap: break-word;
			}
		}
    </style>

<body>
    <div class="page-title">
        <h1>Vòng quay <a href="../games/lover/index.html" style="color:#ff4081;text-decoration:none;">may mắn</a></h1>
        <div style="margin-top:12px;">
            <select id="questionSetTop" onchange="handleQuestionSetChange();" class="set-selection">
                <option value="none">Không sử dụng bộ câu hỏi</option>
                <option value="author">Bộ câu hỏi cho tác giả</option>
                <option value="artist">Bộ câu hỏi cho đặt cồm</option>
            </select>
        </div>
    </div>
    <div class="main-container">
        <div class="control-panel left-panel">
            <h3>Danh sách câu hỏi<br>theo thứ tự</h3>
			<div id="artistPeopleControl" style="display:none;margin:10px 0 14px 0;">
				<div style="font-weight:700;color:#ff4081;margin-bottom:6px;">Số người trong tranh</div>
				<div style="display:flex;align-items:center;gap:10px;">
					<input id="peopleSlider" type="range" min="1" max="5" step="1" value="1" list="peopleTicks" style="width:100%;">
					<datalist id="peopleTicks">
						<option value="1"></option>
						<option value="2"></option>
						<option value="3"></option>
						<option value="4"></option>
						<option value="5"></option>
					</datalist>
					<div style="min-width:36px;text-align:center;border:1px solid rgba(255,64,129,.18);padding:6px 10px;border-radius:8px;"><span id="peopleValue">1</span></div>
				</div>
			</div>
            <div id="setQuestions" class="set-questions" style="display: none;">
                <div class="question-order">
                    <div id="questionList" class="question-list"></div>
                </div>
                <button class="action-button add" onclick="addCustomQuestion()">+ Thêm câu hỏi tùy chỉnh</button>
            </div>
        </div>

        <div class="center-panel">
            <div class="wheel-container">
                <div class="arrow" id="arrow"></div>
                <canvas id="wheelCanvas"></canvas>
            </div>
            <div class="current-question" id="currentQuestion"></div>
			<div id="palettePanel" style="display:none; width:100%; max-width:420px;">
				<div class="palette-column" id="palettePreview"></div>
				<div class="palette-actions" style="display:flex; gap:12px; margin-top:14px; justify-content:center;">
					<button class="action-button add" id="paletteRandomBtn">Random</button>
					<button class="action-button add" id="paletteConfirmBtn" style="background:#ff4081;color:#fff;">Chốt</button>
				</div>
			</div>
            <button class="spin-button" id="spinBtn" onclick="spinWheel()">Quay</button>
            <textarea id="nameInput" class="name-input" oninput="updateNames()" onkeydown="handleEnter(event)">
				Đây
				Là
				Game
				Của
				Phong
			</textarea>
        </div>
            <div class="control-panel right-panel">
            <h3>Câu trả lời có sẵn</h3>
            <div id="predefinedAnswers" class="predefined-answers"></div>
        </div>
    </div>

    <div id="winnerModal" class="modal">
        <div id="winnerHeader" class="modal-header">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2>Chúng ta đã có<br>kết quả!</h2>
        </div>
        <div class="modal-body">
            <p id="winnerText"></p>
        </div>
        <div class="modal-footer">
            <button id="winnerBtn1" type="button" class="modal-button close">Xóa kết quả vừa quay</button>
            <button id="winnerBtn2" type="button" class="modal-button secondary">Quay lần nữa</button>
            <button id="winnerBtn3" type="button" class="modal-button remove">Chốt</button>
        </div>
    </div>

		function evalCond(cond,n){
			if(cond.startsWith(">="))return n>=parseInt(cond.slice(2),10)
			if(cond.startsWith("<="))return n<=parseInt(cond.slice(2),10)
			if(cond.startsWith(">"))return n>parseInt(cond.slice(1),10)
			if(cond.startsWith("<"))return n<parseInt(cond.slice(1),10)
			if(cond.startsWith("="))return n===parseInt(cond.slice(1),10)
			const m=cond.match(/^(\d+)-(\d+)$/)
			if(m){const a=parseInt(m[1],10),b=parseInt(m[2],10);return n>=a&&n<=b}
			return false
		}

		function applyOptionRule(baseOpts,rule){
			let out=baseOpts.slice()
			if(rule.replace&&rule.replace.length) out=rule.replace.slice()
			if(rule.exclude&&rule.exclude.length) out=out.filter(v=>!rule.exclude.includes(v))
			if(rule.add&&rule.add.length) out=[...out,...rule.add]
			return Array.from(new Set(out))
		}

		function buildArtistWithPeople(n){
			const src=questionSets.artist
			const cfg=src.peopleConfig||null
			const base=JSON.parse(JSON.stringify(src.questions))
			let injected=[]
			if(cfg&&cfg.addQuestions&&cfg.addQuestions.length){
				injected=cfg.addQuestions.filter(r=>{
					if(cfg.relationsForAll&&r.question&&r.question.id==="relations")return true
					return evalCond(r.when,n)
				})
			}
			let out=[]
			for(let i=0;i<base.length;i++){
				const q=base[i]
				if(n>=2&&(q.id==="pose"||q.id==="hand post")){continue}
				out.push(q)
				const hit=injected.find(x=>x.insertAfter===q.id)
				if(hit) out.push(hit.question)
				if(n>=2&&cfg&&cfg.charTemplates){
					const ct=cfg.charTemplates
					if(q.id===ct.pose.templateId){
						for(let k=1;k<=n;k++){
							const id=ct.pose.idPrefix+k
							const title=ct.pose.titlePrefix+k
							let opts=q.options.slice()
							let mode="normal"
							if(n>=3)mode="group";else if(n>=2)mode="cp"
							const m=cfg.poseModes[mode]
							if(m.keep) opts=opts.filter(v=>m.keep.includes(v))
							if(m.exclude) opts=opts.filter(v=>!m.exclude.includes(v))
							if(m.add) opts=[...opts,...m.add]
							out.push({id,title,options:Array.from(new Set(opts))})
						}
					}
					if(q.id===ct.hand.templateId){
						for(let k=1;k<=n;k++){
							const id=ct.hand.idPrefix+k
							const title=ct.hand.titlePrefix+k
							let opts=q.options.slice()
							let mode="normal"
							if(n>=3)mode="group";else if(n>=2)mode="cp"
							const m=cfg.handModes[mode]
							if(m.keep) opts=opts.filter(v=>m.keep.includes(v))
							if(m.exclude) opts=opts.filter(v=>!m.exclude.includes(v))
							if(m.add) opts=[...opts,...m.add]
							out.push({id,title,options:Array.from(new Set(opts))})
						}
					}
					if(q.id===ct.accessories.templateId||q.id===ct.species.templateId||q.id===ct.hair.templateId||q.id===ct.expression.templateId){
						const t = q.id===ct.accessories.templateId?ct.accessories:q.id===ct.species.templateId?ct.species:q.id===ct.hair.templateId?ct.hair:ct.expression
						for(let k=1;k<=n;k++){
							out.push({id:t.idPrefix+k,title:t.titlePrefix+k,options:q.options.slice()})
						}
					}
				}
			}
			const optRules=cfg&&cfg.optionRules?cfg.optionRules:null
			if(optRules){
				for(let i=0;i<out.length;i++){
					const q=out[i]
					if(!q.id||!q.options) continue
					if(optRules[q.id]){
						const rules=optRules[q.id]
						let applied=null
						for(const k in rules){if(evalCond(k,n)){applied=rules[k]}}
						if(applied) out[i].options=applyOptionRule(q.options,applied)
					}
				}
			}
			return {name:src.name,questions:out}
		}

		function wirePeopleSlider(){
			const ctrl=document.getElementById("artistPeopleControl")
			const slider=document.getElementById("peopleSlider")
			const val=document.getElementById("peopleValue")
			if(!ctrl||!slider||!val) return
			const cfg=(questionSets.artist&&questionSets.artist.peopleConfig)||{min:1,max:5}
			slider.min=String(cfg.min||1)
			slider.max=String(cfg.max||5)
			slider.step="1"
			slider.value=String(personCount)
			val.textContent=String(personCount)
			slider.oninput=function(e){
				personCount=parseInt(e.target.value,10)
				val.textContent=String(personCount)
				if(document.getElementById("questionSetTop").value!=="artist")return
				const keep=resultsByQuestion
				currentSet=buildArtistWithPeople(personCount)
				if(currentQuestionIndex<0||currentQuestionIndex>=currentSet.questions.length) currentQuestionIndex=0
				updateQuestionList()
				updateCurrentQuestion()
				resultsByQuestion=keep
				renderPredefinedAnswers()
			}
		}
		function applyCrossDependencies(){
			if(document.getElementById("questionSetTop").value!=="artist")return
			const cfg=(questionSets.artist&&questionSets.artist.peopleConfig)||{}
			const dep=(cfg.dependency&&cfg.dependency.pose)||{}
			const n=personCount
			if(!dep||n<2||!currentSet) return
			const qList=currentSet.questions
			const getQ=id=>qList.find(x=>x.id===id)
			const p1=getQ("pose_char1")
			const p2=getQ("pose_char2")
			if(!p1||!p2) return
			const v1=resultsByQuestion["pose_char1"]
			if(!v1) return
			const map=dep[v1]
			if(map&&Array.isArray(map)&&map.length){
				p2.options=Array.from(new Set(map.slice()))
				if(resultsByQuestion["pose_char2"]&&!p2.options.includes(resultsByQuestion["pose_char2"])){
					delete resultsByQuestion["pose_char2"]
				}
			}
		}

		function toHexColor(h,s,l){
			s/=100;l/=100
			const k=n=>(n+h/30)%12
			const a=s*Math.min(l,1-l)
			const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))
			const r=Math.round(255*f(0))
			const g=Math.round(255*f(8))
			const b=Math.round(255*f(4))
			return `#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase()}`
		}

		function generateRandomPalette(n=5){
			const base=Math.random()*360
			const spread=45+Math.random()*60
			return Array.from({length:n},(_,i)=>{
				if(lockedColors[i])return lockedColors[i]
				const h=(base+i*(spread/(n-1)))%360
				const s=65+Math.random()*15
				const l=55+Math.random()*10
				return toHexColor(h,s,l)
			})
		}

		function renderPalette(colors){
			const wrap=document.getElementById('palettePreview')
			wrap.innerHTML=colors.map((c,i)=>{
				const isDark=parseInt(c.slice(1),16)>0xffffff/2?false:true
				const textColor=isDark?'#111':'#fff'
				const locked=lockedColors[i]?'locked':''
				return `<div class="palette-block ${locked}" style="background:${c};color:${textColor}" ondblclick="toggleLock(${i})">${c}</div>`
			}).join('')
		}

		function toggleLock(i){
			if(lockedColors[i])lockedColors[i]=null
			else lockedColors[i]=paletteColors[i]
			renderPalette(paletteColors)
		}

			const selectedSet=topSelect?topSelect.value:"none"
			const setQuestions=document.getElementById("setQuestions")
			const leftPanel=document.querySelector(".left-panel")
			const rightPanel=document.querySelector(".right-panel")
			const nameInput=document.getElementById("nameInput")
			const peopleCtrl=document.getElementById("artistPeopleControl")

			if(selectedSet==="none"){
				names=defaultNames.slice()
				setQuestions.style.display="none"
				leftPanel.style.display="none"
				rightPanel.style.display="none"
				const main=document.querySelector(".main-container")
				if(main){
					main.style.gridTemplateColumns="1fr"
					main.classList.add("single-column")
				}
				if(peopleCtrl) peopleCtrl.style.display="none"
				nameInput.style.display="block"
				nameInput.value=names.join("\n")
				showPalettePanel(false)
				paletteColors=[]
				lockedColors=[]
				document.getElementById("winnerModal").style.display="none"
				if(typeof drawWheel==="function") drawWheel()
				currentSet=null
				currentQuestionIndex=-1
				updateCurrentQuestion()
				renderPredefinedAnswers()
			}else{
				setQuestions.style.display="block"
				leftPanel.style.display="block"
				rightPanel.style.display="block"
				nameInput.style.display="none"
				const main=document.querySelector(".main-container")
				if(main){
					main.style.gridTemplateColumns="minmax(250px, 1fr) minmax(300px, 2fr) minmax(250px, 1fr)"
					main.classList.remove("single-column")
				}
				showPalettePanel(false)
				if(selectedSet==="artist"){
					if(peopleCtrl) peopleCtrl.style.display="block"
					wirePeopleSlider()
					currentSet=buildArtistWithPeople(personCount)
				}else{
					if(peopleCtrl) peopleCtrl.style.display="none"
					currentSet=JSON.parse(JSON.stringify(questionSets[selectedSet]))
				}
				currentQuestionIndex=0
				customQuestions=[]
				updateQuestionList()
				updateCurrentQuestion()
				renderPredefinedAnswers()
			}
		}

        function updateQuestionList() {
            const questionList = document.getElementById("questionList");
            questionList.innerHTML = "";
            
            if (!currentSet) return;
            const questions = [...currentSet.questions, ...customQuestions];
            questions.forEach((question, index) => {
                const item = document.createElement("div");
                item.className = "question-item";
                item.setAttribute('draggable', 'true');

                const drag = document.createElement('span');
                drag.className = 'drag-handle';
                drag.textContent = '⋮';

                const title = document.createElement('span');
                title.textContent = question.title;

                const resultSpan = document.createElement('span');
                resultSpan.style.marginLeft = '10px';
                resultSpan.style.color = '#777';
                if (question.id && resultsByQuestion[question.id]) {
                    resultSpan.textContent = ` — ${resultsByQuestion[question.id]}`;
                }
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index.toString());
                    e.currentTarget.style.opacity = '0.4';
                });
                item.addEventListener('dragend', (e) => {
                    e.currentTarget.style.opacity = '';
                });
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
                    const to = index;
                    if (isNaN(from)) return;
                    const arr = [...currentSet.questions, ...customQuestions];
                    const itemObj = arr.splice(from, 1)[0];
                    arr.splice(to, 0, itemObj);
                    
                    currentSet.questions = arr.slice(0, currentSet.questions.length);
                    customQuestions = arr.slice(currentSet.questions.length).map(q => q.isCustom ? q : q);
                    updateQuestionList();
                    updateCurrentQuestion();
                });

                item.appendChild(drag);
                item.appendChild(title);
                item.appendChild(resultSpan);
				const rem = document.createElement('button');
				rem.className = 'remove-btn';
				rem.textContent = '×';
				rem.title = 'Xóa câu hỏi này';
				rem.onclick = () => {
					if (confirm(`Bạn có chắc muốn xóa câu hỏi "${question.title}"?`)) {
						removeQuestion(index);
					}
				};
                item.appendChild(rem);
                item.style.cursor = 'pointer';
                item.onclick = () => {
                    currentQuestionIndex = index;
                    updateCurrentQuestion();
                    const modal = document.getElementById('winnerModal');
                    if (modal) modal.style.display = 'none';
                };

                questionList.appendChild(item);
            });
        }

        function moveQuestion(index, dir) {
            const questions = [...currentSet.questions, ...customQuestions];
            const newIndex = index + dir;
            if (newIndex < 0 || newIndex >= questions.length) return;
            const arr = questions;
            [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
            
            const fixed = arr.slice(0, currentSet.questions.length);
            const customs = arr.slice(currentSet.questions.length).map(q => q.isCustom ? q : q);
            currentSet.questions = fixed;
            customQuestions = customs;
            updateQuestionList();
        }

		function updateCurrentQuestion(){
			const currentQuestionDiv=document.getElementById("currentQuestion")
			const predefinedAnswers=document.getElementById("predefinedAnswers")
			if(!currentSet||currentQuestionIndex===-1){
				currentQuestionDiv.textContent=""
				predefinedAnswers.innerHTML=""
				return
			}
			const questions=[...currentSet.questions,...customQuestions]
			const currentQuestion=questions[currentQuestionIndex]
			currentQuestionDiv.textContent=(currentQuestionIndex+1)+'. '+currentQuestion.title

			if(currentQuestion.id==='palette'){
				showPalettePanel(true)
				paletteSpin()
				predefinedAnswers.innerHTML=""
				return
			}else{
				showPalettePanel(false)
			}

			if(currentQuestion.options){
				names=currentQuestion.options.slice()
				drawWheel()
			}
			renderPredefinedAnswers()
		}

        function addCustomQuestion() {
            const title = prompt("Nhập câu hỏi mới:");
            if (title) {
                customQuestions.push({
                    id: `custom_${Date.now()}`,
                    title: title,
                    isCustom: true
                });
                updateQuestionList();
            }
        }

        function removeQuestion(index) {
            if (!currentSet) return;
            if (index < currentSet.questions.length) {
                currentSet.questions.splice(index, 1);
            } else {
                const ci = index - currentSet.questions.length;
                if (ci >= 0 && ci < customQuestions.length) customQuestions.splice(ci, 1);
            }
            updateQuestionList();
            updateCurrentQuestion();
            renderPredefinedAnswers();
        }

        function moveToNextQuestion() {
            if (!currentSet) return;
            
            const questions = [...currentSet.questions, ...customQuestions];
            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
            updateCurrentQuestion();
        }
        
		function confirmWinner(){
			document.getElementById('winnerModal').style.display='none'
			if(!currentSet||currentQuestionIndex===-1)return
			const questions=[...currentSet.questions,...customQuestions]
			const q=questions[currentQuestionIndex]
			if(q&&q.id){
				resultsByQuestion[q.id]=lastWinner
				if(q.id==='palette'){
					lockedColors=[...paletteColors]
				}
			}else if(q&&q.title){
				resultsByQuestion[q.title]=lastWinner
			}
			applyCrossDependencies()
			updateQuestionList()
			showPalettePanel(false)
			setTimeout(()=>{moveToNextQuestion();renderPredefinedAnswers()},300)
		}

        function rejectWinner() {
            document.getElementById('winnerModal').style.display = 'none';
        }

        function deleteWinner() {
            
            if (currentSet && currentQuestionIndex !== -1) {
                const questions = [...currentSet.questions, ...customQuestions];
                const q = questions[currentQuestionIndex];
                if (q && q.options && lastWinnerIndex > -1) {
                    q.options.splice(lastWinnerIndex, 1);
                    names = q.options.slice();
                    drawWheel();
                    renderPredefinedAnswers();
                }
            } else {
                
                names = names.filter((n, i) => i !== lastWinnerIndex);
                document.getElementById('nameInput').value = names.join('\n');
                drawWheel();
                renderPredefinedAnswers();
            }
            document.getElementById('winnerModal').style.display = 'none';
        }
        let wheelCanvas = document.getElementById("wheelCanvas");
        let wheelChart;
        
        function generateColors(n) {
            const base = ["#ffcc80", "#ffab91", "#ff8a80", "#f48fb1", "#ce93d8", "#b39ddb", "#90caf9", "#81d4fa", "#a5d6a7", "#ffe082"];
            const out = [];
            for (let i = 0; i < n; i++) {
                out.push(base[i % base.length]);
            }
            return out;
        }
		window.labelMode = 'tangent'
		window.textDirection = 'inward'
		const WheelLabelsPlugin = {
			id: 'wheelLabels',
			afterDatasetsDraw(chart) {
				const ctx = chart.ctx
				const meta = chart.getDatasetMeta(0)
				if (!meta || !meta.data.length) return

				for (let i = 0; i < meta.data.length; i++) {
					const el = meta.data[i]
					const label = chart.data.labels[i] || ''
					if (!el || !label) continue

					const mid = (el.startAngle + el.endAngle) / 2
					const angleW = el.endAngle - el.startAngle
					const r = el.innerRadius + (el.outerRadius - el.innerRadius) * 0.75

					let fontPx = Math.max(9, Math.min(24, el.outerRadius * 0.09))
					ctx.save()
					ctx.translate(el.x, el.y)
					ctx.rotate(mid)
					ctx.textAlign = 'center'
					ctx.textBaseline = 'middle'
					for (;;) {
						ctx.font = `700 ${fontPx}px Quicksand, sans-serif`
						const w = ctx.measureText(label).width
						const maxW = r * angleW * 0.85
						if (w <= maxW || fontPx <= 9) break
						fontPx -= 0.5
					}

					ctx.fillStyle = '#111'
					ctx.fillText(label, r, 0)
					ctx.restore()
				}
			}
		}
        function drawWheel() {
            if (wheelChart) {
                wheelChart.destroy();
            }
            wheelChart = new Chart(wheelCanvas, {
                type: 'pie',
                data: {
                    labels: names,
                    datasets: [{
                            data: names.map(name => name === "" ? 0 : 1),
                            backgroundColor: generateColors(names.length),
                            borderWidth: 1
                        }]
                },
                options: {
                    responsive: true,
                    plugins: {
						legend: {display: false},
						tooltip: {enabled: false}
                    }
                },
                plugins: [WheelLabelsPlugin]
            });
        }
        
    let lastWinner = "";
    let lastWinnerIndex = -1;
    let resultsByQuestion = {};

        function adjustColor(color, amount) {
            let colorInt = parseInt(color.slice(1), 16);
            let r = (colorInt >> 16) + amount;
            let g = ((colorInt >> 8) & 0x00FF) + amount;
            let b = (colorInt & 0x0000FF) + amount;
            r = Math.max(Math.min(255, r), 0);
            g = Math.max(Math.min(255, g), 0);
            b = Math.max(Math.min(255, b), 0);
            return `rgb(${r},${g},${b})`;
        }

        let rotation = 0;
                function determineWinnerFromRotation(rotationDeg) {
                    if (!wheelChart) return 0;
                    const meta = wheelChart.getDatasetMeta(0);
                    const rotRad = (rotationDeg % 360) * Math.PI / 180;
                    let pointerAngle = -rotRad;
                    const TWO = Math.PI * 2;
                    const normalize = (a) => {
                        let v = a % TWO;
                        if (v < 0) v += TWO;
                        return v;
                    };
                    const p = normalize(pointerAngle);
                    for (let i = 0; i < meta.data.length; i++) {
                        const el = meta.data[i];
                        if (!el) continue;
                        let start = normalize(el.startAngle);
                        let end = normalize(el.endAngle);
                        if (start <= end) {
                            if (p >= start && p <= end) return i;
                        } else {
                            if (p >= start || p <= end) return i;
                        }
                    }
                    return 0;
                }
		function spinWheel() {
			if (!wheelChart) return;
			let rotations = Math.floor(Math.random() * 5 + 5) * 360;
			let randomStopAngle = Math.random() * 360;
			let totalRotation = rotations + randomStopAngle;
			let duration = 5000;
			let start = null;

			function normalize(a) {
				const TWO = Math.PI * 2;
				let v = a % TWO;
				if (v < 0) v += TWO;
				return v;
			}

			function animateSpin(timestamp) {
				if (!start) start = timestamp;
				let progress = timestamp - start;
				let easeOut = 1 - Math.pow(1 - progress / duration, 3);
				rotation = easeOut * totalRotation;
				wheelCanvas.style.transform = `rotate(${rotation}deg)`;

				if (progress < duration) {
					requestAnimationFrame(animateSpin);
				} else {
					const meta = wheelChart.getDatasetMeta(0);
					const rotRad = (rotation % 360) * Math.PI / 180;
					const p = normalize(-rotRad);
					let winningIndex = 0;
					for (let i = 0; i < meta.data.length; i++) {
						const el = meta.data[i];
						if (!el) continue;
						let s = normalize(el.startAngle);
						let e = normalize(el.endAngle);
						if (s <= e ? (p >= s && p <= e) : (p >= s || p <= e)) { winningIndex = i; break; }
					}

					lastWinner = names[winningIndex];
					lastWinnerIndex = winningIndex;
					let winnerColor = wheelChart.data.datasets[0].backgroundColor[winningIndex];
					document.getElementById("winnerHeader").style.backgroundColor = adjustColor(winnerColor, -30);
					document.getElementById("winnerText").innerText = lastWinner;

					const btn1 = document.getElementById('winnerBtn1');
					const btn2 = document.getElementById('winnerBtn2');
					const btn3 = document.getElementById('winnerBtn3');

					if (currentSet) {
						btn1.style.display = 'inline-block';
						btn1.textContent = 'Xóa kết quả vừa quay & Quay lại';
						btn1.className = 'modal-button close';
						btn1.onclick = function() { deleteWinner(); };

						btn2.style.display = 'inline-block';
						btn2.textContent = 'Quay lần nữa';
						btn2.className = 'modal-button neutral';
						btn2.onclick = rejectWinner;

						btn3.style.display = 'inline-block';
						btn3.textContent = 'Chốt';
						btn3.className = 'modal-button remove';
						btn3.onclick = confirmWinner;
					} else {
						btn1.style.display = 'inline-block';
						btn1.textContent = 'Đóng';
						btn1.className = 'modal-button close';
						btn1.onclick = closeModal;

						btn2.style.display = 'inline-block';
						btn2.textContent = 'Xóa kết quả vừa quay';
						btn2.className = 'modal-button close';
						btn2.onclick = deleteWinner;

						btn3.style.display = 'none';
					}

					document.getElementById("winnerModal").style.display = "block";
				}
			}
			requestAnimationFrame(animateSpin);
		}

		function closeModal() {
        document.getElementById("winnerModal").style.display = "none";
		}

		function removeWinner() {
            names = names.filter(name => name !== lastWinner);
            document.getElementById("nameInput").value = names.join("\n");
            drawWheel();
            closeModal();
		}

        function updateNames() {
            let nameInput = document.getElementById("nameInput").value.split(/\r?\n/);
            names = [...nameInput];
            wheelChart.data.labels = names;
            wheelChart.data.datasets[0].data = names.map(name => 1);
            wheelChart.update();
            renderPredefinedAnswers();
        }

		function handleEnter(event) {
			if (event.key === "Enter") {
				event.preventDefault();

				names.push("");
				document.getElementById("nameInput").value += "\n";

				wheelChart.data.labels = names;
				wheelChart.data.datasets[0].data.push(1);
				wheelChart.update();
                renderPredefinedAnswers();
			}
		}		

        
    drawWheel();
    handleQuestionSetChange();
    renderPredefinedAnswers();

        
        function splitLabel(text, chunk) {
            if (!text) return '';
            if (text.length <= chunk) return text;
            let out = '';
            for (let i = 0; i < text.length; i += chunk) {
                out += text.substr(i, chunk) + (i + chunk < text.length ? '\n' : '');
            }
            return out;
        }

    function renderPredefinedAnswers() {
			const container = document.getElementById('predefinedAnswers');
            container.innerHTML = '';
            if (!currentSet) {
                return;
            }
            const questions = [...currentSet.questions, ...customQuestions];
            if (questions.length === 0) return;
            const q = questions[currentQuestionIndex];
            if (!q) return;
			if (q.id === 'palette') { container.innerHTML = ''; return; }

            const heading = document.createElement('div');
            heading.style.marginBottom = '8px';
            heading.textContent = q.title;
            container.appendChild(heading);

            const ta = document.createElement('textarea');
            ta.style.width = '100%';
            ta.style.minHeight = '220px';
            ta.style.boxSizing = 'border-box';
            ta.style.padding = '10px';
            ta.style.borderRadius = '8px';
            ta.style.border = '1px solid #f0c0d0';
            ta.value = (q.options || []).join('\n');
            ta.oninput = () => {
                const lines = ta.value.split(/\r?\n/).map(s => s.trim());
                q.options = lines.filter(l => l.length > 0);
                names = q.options.slice();
                drawWheel();
            };

            const hint = document.createElement('div');
            hint.style.fontSize = '12px';
            hint.style.color = '#666';
            hint.style.marginTop = '6px';
            hint.textContent = 'Nhập mỗi lựa chọn trên một dòng. Kéo câu hỏi bên trái để thay đổi thứ tự.';

            container.appendChild(ta);
            container.appendChild(hint);
        }
    </script>
